<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>佛牌搜尋助手</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 20px;
}

.box {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

h1 {
  text-align: center;
}

input {
  width: 95%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 12px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.card {
  background: #eee;
  padding: 10px;
  margin-top: 10px;
  border-radius: 10px;
}
</style>

</head>


<body>

<div class="box">

<h1>🙏 佛牌搜尋助手</h1>

<label>搜尋關鍵字</label>
<input id="search" placeholder="例如：坤平、龍婆宏">


<label>排除文字</label>
<input id="exclude" placeholder="例如：已售完、展示品">


<button onclick="search()">開始搜尋</button>


<div id="result"></div>

</div>


<script>

let products = [
{
name:"龍婆宏 2547 坤平",
price:"3000元"
},
{
name:"龍婆橋 2541 坤平第一期",
price:"4500元"
},
{
name:"帕阿贊安諾 2562 四面神",
price:"2500元"
},
{
name:"坤平 已售完",
price:"2000元"
}
];


function search(){

let keyword=document.getElementById("search").value;
let exclude=document.getElementById("exclude").value;

let result="";


products.forEach(function(item){

if(
item.name.includes(keyword)
&&
!item.name.includes(exclude)
){

result += `
<div class="card">
<h3>${item.name}</h3>
<p>${item.price}</p>
</div>
`;

}

});


if(result==""){
result="沒有找到符合的佛牌";
}


document.getElementById("result").innerHTML=result;

}

</script>


</body>
</html>
