<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>佛牌搜尋助手</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.box{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
}

h1{
text-align:center;
}

input,button{
width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
background:black;
color:white;
cursor:pointer;
}


.card{
background:#eee;
padding:15px;
margin-top:10px;
border-radius:10px;
}


</style>

</head>


<body>


<div class="box">

<h1>🙏 佛牌搜尋助手</h1>


<input id="search" placeholder="搜尋佛牌，例如 坤平 龍婆宏">


<input id="exclude" placeholder="排除，例如 哈努曼 虎爺">


<button onclick="search()">搜尋</button>


<div id="result"></div>


</div>



<script>


let products=[];


//讀取 Python 產生的資料

fetch("products.json")
.then(response=>response.json())
.then(data=>{

products=data;

console.log("載入商品",products.length);

});




function search(){


let keyword=
document.getElementById("search").value;


let exclude=
document.getElementById("exclude").value;



let result="";



products.forEach(item=>{


let name=item.name;



if(
name.includes(keyword)
&&
!name.includes(exclude)
){


result += `

<div class="card">

<h3>${item.name}</h3>

<p>價格：${item.price}</p>

</div>

`;

}


});



if(result==""){

result="沒有找到符合商品";

}



document.getElementById("result").innerHTML=result;


}


</script>


</body>

</html>
